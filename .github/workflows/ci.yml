# Etapa de commit: feedback rápido (< 1 min) en cada push y en cada pull request.
# El job se llama "pruebas": es el check que exige la regla de protección de main (LAB 1, paso 6).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias
        run: npm test
