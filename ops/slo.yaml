# LAB 1 · paso 5 · Objetivo de nivel de servicio (SLO) de CitaYa
# Completa los huecos marcados con ???. Este archivo es el acuerdo INTERNO del equipo:
# el SLA con la Concejalía es más laxo (99 %) y el SLO es más exigente para tener margen.

servicio: CitaYa · cita previa de la sede electrónica
responsable: Sisco                    # tu nombre o el del equipo

sla_con_negocio:
  disponibilidad_mensual: 99.0        # % comprometido con la Concejalía (consecuencias si se incumple)

sli:
  nombre: disponibilidad
  definicion: "% de peticiones a la portada con respuesta 200 en < 2 s                     # p. ej. "% de peticiones a la portada con respuesta 200 en < 2 s"
  fuente: logs                        # de dónde sale el dato (sonda externa, logs del balanceador...)

slo:
  objetivo: 99.5                      # % en ventana móvil
  ventana_dias: 30

error_budget:
  # Minutos de indisponibilidad que podemos "gastar" en la ventana sin incumplir el SLO.
  # Fórmula: ventana_dias × 24 × 60 × (100 − objetivo) / 100
  minutos: 216
  politica_si_se_agota: se congelan funcionalidades y solo se despliegan arreglos de fiabilidad           # p. ej. "se congelan funcionalidades y solo se despliegan arreglos de fiabilidad"
